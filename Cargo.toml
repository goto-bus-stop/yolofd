[package]
name = "yolofd"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Tiny, synchronous multipart/form-data writer"
authors = ["Renée Kooi <renee@kooi.me>"]
repository = "https://github.com/goto-bus-stop/yolofd"
documentation = "https://yolofd.surge.sh/yolofd"
readme = "README.md"
edition = "2018"

[dependencies]
v_escape = "0.18.0"
rand = { version = "0.8.5", optional = true }

[features]
default = ["rand"]
